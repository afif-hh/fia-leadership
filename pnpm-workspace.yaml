packages:
  - "."
# Build scripts allowed to run on install. pnpm blocks these by default and
# exits non-zero until each is answered, which is what made shadcn-vue's init
# abort after its dependencies had already installed.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  # reka-ui depends on vue-demi, whose postinstall selects the Vue 2 or Vue 3 shim.
  vue-demi: true
minimumReleaseAgeExclude:
  - '@vue/language-core@3.3.11'
  - eslint@10.9.0
  - vue-tsc@3.3.11
