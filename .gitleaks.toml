# Secret-scanning rules for CI.
#
# Extends gitleaks' built-in ruleset rather than replacing it, then adds two precise rules.
#
# Measured, not assumed. `opencode.json` in this repository holds a live Google API key beginning
# `AQ.`. Committing a synthetic key of that shape and scanning it both ways gives:
#
#   default rules   -> caught, by `generic-api-key`
#   this config     -> caught, by `google-api-key-header` and `google-aq-credential`
#
# So the defaults do catch it, and an earlier version of this comment claiming otherwise was wrong.
# The named rules still earn their place for two reasons. `generic-api-key` is an entropy heuristic
# — the kind of rule a team eventually tunes down or disables after a run of false positives, and
# the day that happens this repository's specific hazard would stop being covered without anyone
# deciding to stop covering it. And a finding reported as `google-aq-credential` says what was
# leaked and which credential to rotate, where `generic-api-key` says only that something looked
# random.
#
# Worth knowing if these are ever edited: gitleaks' built-in `gcp-api-key` rule matches only the
# older `AIza` format and does not match an `AQ.` key at all.

[extend]
useDefault = true

[[rules]]
id = "google-aq-credential"
description = "Google credential in the AQ. format (OAuth / API key), which the default gcp-api-key rule does not cover"
regex = '''\bAQ\.[A-Za-z0-9_\-]{20,}'''
keywords = ["AQ."]

[[rules]]
id = "google-api-key-header"
description = "An X-Goog-Api-Key header carrying a literal value rather than a variable reference"
regex = '''(?i)["']?X-Goog-Api-Key["']?\s*[:=]\s*["'][A-Za-z0-9._\-]{20,}["']'''
keywords = ["x-goog-api-key"]

[allowlist]
description = "Paths and values that are fixtures or documentation, not credentials"
paths = [
  # This file describes the patterns; it must not match itself.
  '''\.gitleaks\.toml$''',
  # Placeholders only, and deliberately committed so the app can be run locally.
  '''\.env\.example$''',
  # Throwaway fixtures for a database that is created and deleted inside a single test run.
  '''server/tests/e2e/setup\.ts$''',
]
regexes = [
  '''change-me[a-z0-9\-]*''',
  '''e2e-fixture-[a-z0-9\-]*''',
  '''local-dev-[a-z0-9\-]*''',
]
